# Publishes one prepared note per day at a fixed time.
#
# Prepare a note on a branch named "release-<id>" (for example release-0014)
# containing at least the PDF and the notes.json entry. To queue several notes,
# create each release branch from the previous one. Every day at 01:37 UTC
# this workflow takes the oldest release-* branch, squashes it onto main,
# rebuilds every page with tools/build.js, commits the result as
# github-actions[bot] with a UTC timestamp, deletes the branch and asks GitHub
# Pages to rebuild. If no release-* branch exists, it does nothing.
#
# Main therefore only ever receives commits authored by the bot in UTC; the
# individual commits on the release branch are not carried into main.

name: scheduled-release

on:
  schedule:
    - cron: "37 1 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Check only: do not commit or publish"
        type: boolean
        default: true

permissions:
  contents: write
  pages: write

concurrency:
  group: scheduled-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
      GH_TOKEN: ${{ github.token }}
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Find the oldest release branch
        id: find
        run: |
          BRANCH=$(git ls-remote --heads origin 'release-*' | awk '{print $2}' | sed 's#^refs/heads/##' | sort | head -n 1)
          if [ -z "$BRANCH" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No release-* branch: nothing to release."
            exit 0
          fi
          ID="${BRANCH#release-}"
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          git fetch origin "$BRANCH"
          echo "Releasing $BRANCH (note $ID). Changes against main:"
          git diff --stat main "origin/$BRANCH"

      - name: Squash the release branch onto main
        if: steps.find.outputs.found == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # A release branch may be stacked on an earlier release branch that
          # is already published. Where both changed the same lines, take the
          # release branch's version, then check that no note on main is lost.
          git merge --squash --no-commit -X theirs "origin/${{ steps.find.outputs.branch }}"
          python3 - "${{ steps.find.outputs.id }}" <<'PY'
          import json, subprocess, sys
          new_id = sys.argv[1]
          old = json.loads(subprocess.check_output(["git", "show", "HEAD:notes.json"]))
          new = json.load(open("notes.json"))
          old_ids = [n["id"] for n in old]
          new_ids = [n["id"] for n in new]
          missing = sorted(set(old_ids) - set(new_ids))
          if missing:
              sys.exit("Release would remove notes already on main: " + ", ".join(missing))
          if new_id not in new_ids:
              sys.exit("notes.json has no entry " + new_id)
          if len(new_ids) != len(set(new_ids)):
              sys.exit("Duplicate note ids in notes.json")
          print("notes.json OK: %d notes, adds %s" % (len(new_ids), ", ".join(sorted(set(new_ids) - set(old_ids)))))
          PY
          test -f "pdf/${{ steps.find.outputs.id }}.pdf" || { echo "Missing pdf/${{ steps.find.outputs.id }}.pdf"; exit 1; }

      - uses: actions/setup-node@v4
        if: steps.find.outputs.found == 'true'
        with:
          node-version: "20"

      - name: Rebuild the site
        if: steps.find.outputs.found == 'true'
        run: |
          npm install --no-save --no-package-lock katex@0.16.11
          node tools/build.js
          rm -rf node_modules

      - name: Commit as the bot and publish
        if: steps.find.outputs.found == 'true'
        run: |
          git add -A
          git commit -m "Add note ${{ steps.find.outputs.id }}"
          git log --format='%h %an <%ae> %ad %s' --date=iso -2
          git show --stat --format= HEAD
          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run: release builds and commits cleanly; nothing pushed."
          else
            git push origin main
            git push origin --delete "${{ steps.find.outputs.branch }}"
          fi

      - name: Request a GitHub Pages build
        if: steps.find.outputs.found == 'true' && env.DRY_RUN != 'true'
        run: |
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" --jq '.status'

      - name: Notify search engines (IndexNow)
        if: steps.find.outputs.found == 'true' && env.DRY_RUN != 'true'
        continue-on-error: true
        run: |
          # Give GitHub Pages time to deploy, then tell IndexNow engines (Bing,
          # Yandex and others) which pages changed. Failure does not affect
          # the release.
          sleep 120
          python3 - "${{ steps.find.outputs.id }}" <<'PY'
          import glob, json, os, re, sys, urllib.request
          note_id = sys.argv[1]
          site = "https://equilibriumdaily.github.io"
          keys = [f[:-4] for f in glob.glob("*.txt") if re.fullmatch(r"[0-9a-f]{32}\.txt", f)]
          if not keys:
              sys.exit("No IndexNow key file found.")
          note = next(n for n in json.load(open("notes.json")) if n["id"] == note_id)
          urls = [site + "/", site + "/archive.html", site + "/notes/" + note_id + ".html",
                  site + "/sections/" + note["section"] + ".html", site + "/feed.xml",
                  site + "/sitemap.xml", site + "/llms.txt", site + "/llms-full.txt"]
          body = json.dumps({"host": "equilibriumdaily.github.io", "key": keys[0],
                             "keyLocation": site + "/" + keys[0] + ".txt", "urlList": urls}).encode()
          req = urllib.request.Request("https://api.indexnow.org/indexnow", data=body,
                                       headers={"Content-Type": "application/json; charset=utf-8"})
          with urllib.request.urlopen(req, timeout=30) as r:
              print("IndexNow status", r.status, "for", len(urls), "URLs")
          PY
